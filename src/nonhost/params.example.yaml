# RNAquarium Part I example parameters
# Update paths to match your environment

# --- Input (choose one) ---
accession-list: data/SRA_accessions_list.test.txt
# fastq-path: /path/to/fastqs/*_R{1,2}_001.fastq.gz

# --- Reference genome (GRCz12tu) ---
ref-genome: /path/to/GCF_049306965.1_GRCz12tu_genomic.fa.gz
ref-genome-gtf: /path/to/GCF_049306965.1_GRCz12tu_genomic.gtf
ercc-fa: /path/to/ERCC92.fa
ercc-gtf: /path/to/ERCC92.gtf
contam-fa: danio_refseq.fasta
genome-size: 1448808683

# --- Pre-built indexes (optional, saves time on re-runs) ---
# hisat-ref-indexes:     output/hisat2_GCF_049306965.1_GRCz12tu_genomic_indexes
# star-ref-indexes-ercc: output/star_GCF_049306965_indexes.ERCC
# star-ref-indexes:      output/star_GCF_049306965_indexes
# bowtie-ref-indexes:    output/bowtie2_GCF_049306965.1_GRCz12tu_genomic_indexes
# gsnap-ref-indexes:     output/gmap_GCF_049306965_indexes
# kb-contam-indexes:     output/kallisto_contam_indexes

# --- Scratch / temp ---
tmp: /tmp/
# backup-tmp: /local/scratch/

# --- Pipeline behavior ---
backup-scratch-hack: true
hisat-use-transcript: true
publish-intermediate: false
star-use-shared-mem: false
skip-host-counts: false
output-cram: false
cleanup-intermediate: true
nxf-unstage-hack: true
retain-mixed: true
kb-retain-mixed: false

# --- Resources ---
parallel-downloads: 50
max-cpus: 128
max-memory: "256GB"
star-threads-small: 4
star-threads-large: 16
